services:
  blogportalpostgres:
    image: postgres:16
    container_name: blogportalpostgres
    environment:
      POSTGRES_DB: blog_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - blogportalpostgresdata:/var/lib/postgresql/data

volumes:
  blogportalpostgresdata: